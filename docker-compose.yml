services:
  postgres:
    image: postgres:16-alpine
    container_name: phobos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: phobos
      POSTGRES_PASSWORD: phobos
      POSTGRES_DB: phobos
    ports:
      - "5432:5432"
    volumes:
      - phobos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phobos -d phobos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  phobos-pgdata:
